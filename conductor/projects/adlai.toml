# ADLAI — project #1 for the conductor harness.
# AI-native Saudi legal assistant (bilingual AR/EN hybrid-RAG).

[project]
name = "adlai"
repo = "~/Documents/ADLAI"
vault = "~/Documents/ADLAI/adlai-vault"
agents_md = "~/Documents/ADLAI/CLAUDE.md"
qa_cmd = "uv run pytest backend/tests/unit -q"
commit_template = "{type}: {subject}"
max_qa_retries = 2

# Routing table: which headless CLI owns each pipeline node.
# Omit a node to fall back to conductor.workers.DEFAULT_ROUTING.
#
# Supported keys per entry:
#   worker      = binary name on PATH (claude, gemini, qwen, opencode, …)
#   model       = model identifier passed via the CLI's -m / --model flag
#   extra_args  = list of additional CLI arguments
#   read_only   = true enforces planning mode (gemini, qwen only)
#   use_dash    = true spawns the job in the dash TUI instead of a local subprocess
#   dash_mode   = "sh" (shell), "exec" (direct), or "wt" (WezTerm PTY pane); default "sh"

[routing.plan]
worker = "qwen"
model = "qwen/qwen3-coder-flash"
read_only = true          # --approval-mode plan: planner cannot write

[routing.act]
worker = "qwen"
model = "qwen/qwen3-coder-flash"

[routing.bulk]
worker = "qwen"
model = "qwen/qwen3-coder-flash"

[routing.review]
worker = "qwen"
model = "qwen/qwen3-coder-flash"

